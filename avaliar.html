<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliação — L3 Operações e Qualidade</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#002726;--green:#93F574;--t1:#40615E;--t2:#678A88;--mist:#B9C9C9;--white:#FFFFFF;--card:#03302F;--border:rgba(147,245,116,0.15);--border2:rgba(147,245,116,0.3);--warn:#F6C343}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);-webkit-font-smoothing:antialiased}
.hdr{height:56px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--dark);z-index:100}
.logo{height:22px;width:auto}
.badge{font-size:11px;font-weight:500;color:var(--green);border:1px solid var(--border2);padding:3px 12px;border-radius:99px}
.btn-p{background:var(--green);color:var(--dark);border:none;border-radius:10px;padding:10px 24px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s}
.btn-p:hover{opacity:.88}
.btn-s{background:transparent;color:var(--mist);border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer}
.btn-s:hover{border-color:var(--t2);color:var(--white)}
/* LOGIN */
.login{height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px;text-align:center}
.login-box h2{font-size:22px;font-weight:600;margin-bottom:8px}
.login-box p{font-size:13px;color:var(--mist);margin-bottom:24px}
.inp{width:100%;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--white);font-size:13px;font-family:'Inter',sans-serif;outline:none;margin-bottom:12px}
.inp:focus{border-color:var(--green)}
.err{font-size:12px;color:#E55B5B;margin-top:-8px;margin-bottom:12px;display:none}
/* LAYOUT */
.app{display:none}
.sidebar{width:280px;border-right:1px solid var(--border);height:calc(100vh - 56px);overflow-y:auto;padding:20px;position:sticky;top:56px;flex-shrink:0}
.sidebar h3{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.cand-btn{width:100%;background:transparent;border:1px solid transparent;border-radius:9px;padding:10px 12px;text-align:left;cursor:pointer;font-family:'Inter',sans-serif;margin-bottom:4px;transition:all .15s}
.cand-btn:hover{background:rgba(147,245,116,.05);border-color:var(--border)}
.cand-btn.active{background:rgba(147,245,116,.1);border-color:var(--border2)}
.cand-name{font-size:13px;color:var(--white);font-weight:500}
.cand-email{font-size:11px;color:var(--t2);margin-top:2px}
.cand-score{font-size:11px;color:var(--green);margin-top:2px}
.main-area{flex:1;overflow-y:auto;padding:32px}
/* CONTENT */
.sc-header{margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.sc-header h2{font-size:22px;font-weight:600;margin-bottom:4px}
.sc-header p{font-size:13px;color:var(--mist)}
.scenario-block{margin-bottom:32px}
.scenario-title{font-size:14px;font-weight:600;color:var(--green);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.qa-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.q-text{font-size:13px;font-weight:500;color:var(--white);margin-bottom:12px;line-height:1.6}
.q-num{color:var(--green);font-weight:600;margin-right:6px}
.answer-box{background:rgba(0,0,0,.2);border-radius:8px;padding:14px;font-size:13px;color:var(--mist);line-height:1.75;margin-bottom:16px;min-height:60px;white-space:pre-wrap}
.answer-empty{color:var(--t1);font-style:italic}
.criteria-box{background:rgba(147,245,116,.04);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px}
.criteria-lbl{font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.criteria-txt{font-size:12px;color:var(--mist);line-height:1.7}
.nota-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nota-lbl{font-size:12px;color:var(--mist);flex-shrink:0}
.nota-btns{display:flex;gap:6px}
.nb{width:40px;height:40px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--mist);font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.nb:hover{border-color:var(--green);color:var(--green)}
.nb.selected{background:var(--green);color:var(--dark);border-color:var(--green)}
.save-bar{position:sticky;bottom:0;background:var(--dark);border-top:1px solid var(--border);padding:16px 32px;display:flex;justify-content:space-between;align-items:center}
.save-status{font-size:12px;color:var(--t2)}
.save-status.ok{color:var(--green)}
.empty-state{text-align:center;padding:80px 20px;color:var(--t2)}
.empty-state p{font-size:14px;margin-top:8px}
.score-summary{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:16px 20px;margin-bottom:24px;display:flex;gap:24px;flex-wrap:wrap}
.score-item{text-align:center}
.score-val{font-size:24px;font-weight:600;color:var(--green)}
.score-lbl{font-size:11px;color:var(--t2);margin-top:2px}
.loading{font-size:12px;color:var(--t2);padding:12px 0}
/* PARECER FINAL */
.parecer-block{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:24px;margin-top:8px;margin-bottom:20px}
.parecer-title{font-size:14px;font-weight:600;color:var(--green);margin-bottom:18px}
.obs-lbl{font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.obs-ta{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--white);font-size:13px;font-family:'Inter',sans-serif;outline:none;resize:vertical;min-height:68px;line-height:1.65;transition:border-color .2s}
.obs-ta:focus{border-color:rgba(147,245,116,.5)}
.obs-ta::placeholder{color:var(--t1)}
/* IA */
.ia-block{background:var(--card);border:1px solid rgba(246,195,67,.25);border-radius:14px;padding:24px;margin-bottom:32px}
.ia-title{font-size:14px;font-weight:600;color:var(--warn);margin-bottom:6px}
.ia-desc{font-size:12px;color:var(--mist);margin-bottom:18px;line-height:1.6}
.ia-nivel-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.nivel-btn{padding:8px 20px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--mist);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.nivel-btn:hover{border-color:var(--warn);color:var(--warn)}
.nivel-btn.sel-baixa{background:rgba(147,245,116,.15);border-color:var(--green);color:var(--green)}
.nivel-btn.sel-media{background:rgba(246,195,67,.15);border-color:var(--warn);color:var(--warn)}
.nivel-btn.sel-alta{background:rgba(229,91,91,.15);border-color:#E55B5B;color:#E55B5B}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login-screen">
  <div class="login-box">
    <h2>Área de Avaliação</h2>
    <p>Acesso restrito à equipe avaliadora.</p>
    <input class="inp" type="password" id="pwd" placeholder="Senha" onkeydown="if(event.key==='Enter')checkPwd()">
    <p class="err" id="pwd-err">Senha incorreta.</p>
    <button class="btn-p" onclick="checkPwd()" style="width:100%">Entrar</button>
  </div>
</div>

      {q:'O que você faz com cada uma das demandas?',
       c:'Define o que atende primeiro, comunica para os outros que está ciente e dá prazo de retorno. Redireciona o que pode ser resolvido por outros. Não deixa ninguém sem resposta.'},
      {q:'Como você se comunica com quem está esperando?',
       c:'Comunicação direta e honesta: "Estou ciente, atendendo uma prioridade urgente agora e retorno em X." Define prazo realista. Não promete o que não pode. Personaliza para cada demanda.'}
    ]},
  c4:{
    title:'Cenário 04 — Processos e melhoria contínua',
    qs:[
      {q:'Como você avalia o caso para entender se é uma falta de processo, documentação ou capacidade técnica?',
       c:'Analisa os 15 tickets para identificar padrão. Conversa com os analistas L2 envolvidos. Verifica se existe processo ou documentação sobre o tema. Testa se o L2 consegue resolver com orientação pontual.'},
      {q:'O que você faz para resolver isso de forma definitiva?',
       c:'Solução estrutural: criação ou atualização do processo + treinamento do L2 + acompanhamento por período. Não resolve só o caso pontual. Envolve a liderança do L2 na solução.'},
      {q:'Como você mede se a solução funcionou?',
       c:'Define métrica clara: redução de escalonamentos do mesmo tema nos próximos 30/60 dias. Acompanha ativamente e ajusta se necessário.'},
      {q:'Como você comunica essa situação para a liderança?',
       c:'Apresenta o problema com dados (15 casos, 2 meses, mesmo tema), a causa identificada, a solução proposta e o impacto esperado. Tom propositivo, não apenas de reporte de problema.'}
    ]},
  c5:{
    title:'Cenário 05 — Gestão de backlog com DEV',
    qs:[
      {q:'Como você faz para mapear a situação atual da fila e entender o que está realmente parado?',
       c:'Levanta todos os tickets, classifica por tempo parado e por impacto no cliente, verifica quais têm responsável definido, identifica os que nunca tiveram atualização.'},
      {q:'Com base nesse levantamento, como você define a prioridade entre os casos novos e os casos parados?',
       c:'Define critérios: impacto no cliente (quantos afetados, impacto operacional), tempo parado (casos com 8 meses merecem atenção especial), plano do cliente (Elite/Diamante têm prioridade).'},
      {q:'Como você se comunica com o time de DEV para cobrar andamento sem prejudicar o relacionamento?',
       c:'Agenda alinhamento com o DEV apresentando dados (tickets parados, impacto). Tom colaborativo: busca entender impedimentos antes de cobrar. Propõe solução conjunta.'},
      {q:'Como você mantém os clientes e o time de suporte informados sobre casos que estão há meses sem resolução?',
       c:'Define processo de atualização periódica para clientes com casos parados (mesmo sem novidade). Orienta time de suporte com script para não criar falsas expectativas.'}
    ]}
};

// Mapeamento das chaves CRITERIA -> colunas Supabase
// CRITERIA usa 'c1' -> colunas 'c1_q1', 'c1_q2'…
// mas submissions tem 'c1_q1' (minúsc) → bate direto
// A chave gerada é: ck='c1', qi=0 → key='c1_q1' ✓

// Chaves válidas de nota (evita somar id, submission_id, etc.)
const NOTE_KEYS = Object.keys(CRITERIA).flatMap(ck =>
  CRITERIA[ck].qs.map((_,qi) => `${ck}_q${qi+1}`)
);

let currentSub=null, notes={}, submissions=[], avaliacoes={};

function checkPwd(){
  const v=document.getElementById('pwd').value;
  if(v===PWD){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    loadSubmissions();
  } else {
    document.getElementById('pwd-err').style.display='block';
  }
}

function logout(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  currentSub=null; notes={}; submissions=[]; avaliacoes={};
}

async function loadSubmissions(){
  document.getElementById('cand-list').innerHTML='<p class="loading">Carregando...</p>';
  try {
    // FIX: busca todas submissions (sem filtro de email único no server, fazemos no client)
    const r=await fetch(`${SUPABASE_URL}/rest/v1/submissions?select=*&order=created_at.asc`,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
    });
    if(!r.ok) throw new Error('Erro ao buscar submissions: '+r.status);
    submissions=await r.json();

    const r2=await fetch(`${SUPABASE_URL}/rest/v1/avaliacoes?select=*`,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
    });
    if(!r2.ok) throw new Error('Erro ao buscar avaliações: '+r2.status);
    const avs=await r2.json();
    avaliacoes={};
    avs.forEach(a=>{ avaliacoes[a.submission_id]=a; });

    renderCandList();
  } catch(e) {
    document.getElementById('cand-list').innerHTML='<p style="font-size:12px;color:#E55B5B">Erro ao carregar. Verifique a conexão.</p>';
    console.error(e);
  }
}

function renderCandList(){
  // Deduplica por email, mantendo o mais recente (não o primeiro)
  const byEmail={};
  submissions.forEach(s=>{
    if(!byEmail[s.email] || new Date(s.created_at) > new Date(byEmail[s.email].created_at)){
      byEmail[s.email]=s;
    }
  });
  const unique=Object.values(byEmail).sort((a,b)=>a.name.localeCompare(b.name,'pt'));

  const list=document.getElementById('cand-list');
  if(!unique.length){
    list.innerHTML='<p style="font-size:12px;color:var(--t2)">Nenhuma resposta ainda.</p>';
    return;
  }
  list.innerHTML=unique.map(s=>{
    const av=avaliacoes[s.id];
    const total=av ? NOTE_KEYS.reduce((sum,k)=>sum+(typeof av[k]==='number'?av[k]:0),0) : null;
    // FIX: usa Number(s.id) para comparação consistente
    const isActive = currentSub && Number(currentSub.id)===Number(s.id);
    return `<button class="cand-btn ${isActive?'active':''}" onclick="selectCandidate(${s.id})">
      <div class="cand-name">${escHtml(s.name)}</div>
      <div class="cand-email">${escHtml(s.email)}</div>
      <div class="cand-score">${total!==null?`✓ Avaliado — ${total} pts`:'Não avaliado'}</div>
    </button>`;
  }).join('');
}

function escHtml(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function selectCandidate(id){
  // FIX principal: converte para Number para garantir match correto (o id vem como number do JSON)
  const numId = Number(id);
  currentSub = submissions.find(s=>Number(s.id)===numId) || null;
  if(!currentSub){ console.error('Candidato não encontrado:', id); return; }
  notes = avaliacoes[numId] ? {...avaliacoes[numId]} : {};
  renderCandList();
  renderMain();
  document.getElementById('save-bar').style.display='flex';
}

function getAns(s, key){
  // Tenta pegar do objeto submission pela chave gerada (ex: c1_q1)
  // As colunas no Supabase são c1_q1, c1_q2… (minúsculas)
  if(s[key] !== undefined) return s[key];
  // Fallback: tenta maiúsculas (C1_Q1)
  const upper = key.toUpperCase();
  if(s[upper] !== undefined) return s[upper];
  return '';
}

function renderMain(){
  if(!currentSub) return;
  const s=currentSub;

  const totalNotes=Object.keys(CRITERIA).reduce((sum,ck)=>{
    return sum+CRITERIA[ck].qs.reduce((s2,_,qi)=>{
      const k=`${ck}_q${qi+1}`;
      return s2+(notes[k]||0);
    },0);
  },0);
  const maxNotes=Object.keys(CRITERIA).reduce((sum,ck)=>sum+CRITERIA[ck].qs.length*5,0);

  let html=`<div class="sc-header">
    <h2>${escHtml(s.name)}</h2>
    <p>${escHtml(s.email)} · ${escHtml(s.time_used||'—')} · ${new Date(s.created_at).toLocaleDateString('pt-BR')}</p>
  </div>
  <div class="score-summary">
    ${Object.keys(CRITERIA).map(ck=>{
      const sc=CRITERIA[ck].qs.reduce((sum,_,qi)=>sum+(notes[`${ck}_q${qi+1}`]||0),0);
      const max=CRITERIA[ck].qs.length*5;
      return `<div class="score-item"><div class="score-val">${sc}/${max}</div><div class="score-lbl">${ck.toUpperCase()}</div></div>`;
    }).join('')}
    <div class="score-item"><div class="score-val" style="color:var(--warn)">${totalNotes}/${maxNotes}</div><div class="score-lbl">TOTAL</div></div>
  </div>`;

  Object.keys(CRITERIA).forEach(ck=>{
    const sc=CRITERIA[ck];
    html+=`<div class="scenario-block">
      <div class="scenario-title">◆ ${escHtml(sc.title)}</div>`;
    sc.qs.forEach((q,qi)=>{
      const key=`${ck}_q${qi+1}`;
      const ans=getAns(s,key);
      const nota=notes[key]||0;
      html+=`<div class="qa-block">
        <p class="q-text"><span class="q-num">${qi+1}.</span>${escHtml(q.q)}</p>
        <div class="answer-box ${!ans?'answer-empty':''}">${ans?escHtml(ans):'Não respondido'}</div>
        <div class="criteria-box">
          <p class="criteria-lbl">📋 Critério de avaliação</p>
          <p class="criteria-txt">${escHtml(q.c)}</p>
        </div>
        <div class="nota-row">
          <span class="nota-lbl">Nota:</span>
          <div class="nota-btns">
            ${[1,2,3,4,5].map(n=>`<button class="nb ${nota===n?'selected':''}" onclick="setNota('${key}',${n})">${n}</button>`).join('')}
          </div>
          ${nota?`<span style="font-size:12px;color:var(--green)">✓ ${nota} ponto${nota>1?'s':''}</span>`:''}
        </div>
      </div>`;
    });
    html+=`</div>`;
  });

  // ── BLOCO FINAL DE PARECER ──────────────────────────────────
  const obsGeral=notes['obs_geral']||'';
  const iaNivel=notes['ia_nivel']||'';
  const iaObs=notes['obs_ia']||'';

  // Tabela resumo por cenário
  const resumoRows=Object.keys(CRITERIA).map(ck=>{
    const sc=CRITERIA[ck].qs.reduce((sum,_,qi)=>sum+(notes[`${ck}_q${qi+1}`]||0),0);
    const max=CRITERIA[ck].qs.length*5;
    const pct=max>0?sc/max:0;
    const cor=pct>=0.8?'var(--green)':pct>=0.5?'var(--warn)':'#E55B5B';
    return `<tr>
      <td style="padding:10px 12px;font-size:13px;color:var(--mist);border-bottom:1px solid rgba(147,245,116,.07)">${escHtml(CRITERIA[ck].title)}</td>
      <td style="padding:10px 12px;font-size:14px;font-weight:600;color:${cor};border-bottom:1px solid rgba(147,245,116,.07);white-space:nowrap">${sc}/${max}</td>
    </tr>`;
  }).join('');

  html+=`<div class="parecer-block">
    <div class="parecer-title">📊 Parecer final</div>

    <table style="width:100%;border-collapse:collapse;margin-bottom:20px;background:rgba(0,0,0,.15);border-radius:8px;overflow:hidden">
      <thead>
        <tr>
          <th style="padding:9px 12px;font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;text-align:left;border-bottom:1px solid var(--border)">Cenário</th>
          <th style="padding:9px 12px;font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;text-align:left;border-bottom:1px solid var(--border)">Pontuação</th>
        </tr>
      </thead>
      <tbody>${resumoRows}</tbody>
    </table>

    <p class="obs-lbl" style="margin-bottom:8px">💬 Observações gerais</p>
    <textarea class="obs-ta" id="obs_geral"
      placeholder="Pontos fortes, pontos fracos, recomendação geral sobre o candidato…"
      oninput="setObs('obs_geral',this.value)"
      style="min-height:110px">${escHtml(obsGeral)}</textarea>
  </div>

  <div class="ia-block">
    <p class="ia-title">🤖 Análise de Uso de IA</p>
    <p class="ia-desc">Sinais a observar: uniformidade de estrutura entre cenários, linguagem excessivamente polida, ausência de exemplos ou marcas pessoais, tempo de preenchimento suspeito, vocabulário técnico perfeito sem variação.</p>
    <p style="font-size:12px;color:var(--mist);margin-bottom:10px;font-weight:500">Suspeita de uso:</p>
    <div class="ia-nivel-row">
      ${['baixa','media','alta'].map(n=>`<button class="nivel-btn ${iaNivel===n?'sel-'+n:''}" onclick="setNivel('${n}')">${n.charAt(0).toUpperCase()+n.slice(1)}</button>`).join('')}
    </div>
    <textarea class="obs-ta" id="obs_ia"
      placeholder="Descreva os sinais observados…"
      oninput="setObs('obs_ia',this.value)"
      style="min-height:100px">${escHtml(iaObs)}</textarea>
  </div>`;

  const mainArea=document.getElementById('main-area');
  const scrollTop=mainArea.scrollTop;
  mainArea.innerHTML=html;
  mainArea.scrollTop=scrollTop;
}

function setNota(key,val){
  notes[key]=val;
  renderMain();
}

function setObs(key,val){
  notes[key]=val;
}

function setNivel(val){
  notes['ia_nivel']=val;
  // Atualiza só os botões de nível sem re-renderizar tudo
  document.querySelectorAll('.nivel-btn').forEach(b=>{
    b.className='nivel-btn';
    if(b.textContent.toLowerCase()===val) b.className='nivel-btn sel-'+val;
  });
}

async function saveNotes(){
  if(!currentSub) return;
  const st=document.getElementById('save-status');
  st.textContent='Salvando…'; st.className='save-status';

  const payload={
    submission_id: Number(currentSub.id),
    name: currentSub.name,
    email: currentSub.email,
    ...notes
  };
  // Remove campos gerados automaticamente pelo Supabase
  delete payload.id;
  delete payload.created_at;
  delete payload.updated_at;

  const existing=avaliacoes[Number(currentSub.id)];
  let r;
  if(existing){
    r=await fetch(`${SUPABASE_URL}/rest/v1/avaliacoes?submission_id=eq.${currentSub.id}`,{
      method:'PATCH',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=minimal'},
      body:JSON.stringify(payload)
    });
  } else {
    r=await fetch(`${SUPABASE_URL}/rest/v1/avaliacoes`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=minimal'},
      body:JSON.stringify(payload)
    });
  }

  if(r.ok){
    avaliacoes[Number(currentSub.id)]=payload;
    st.textContent='✓ Avaliação salva!'; st.className='save-status ok';
    renderCandList();
  } else {
    const errText=await r.text().catch(()=>'');
    st.textContent='Erro ao salvar. Tente novamente.'; st.className='save-status';
    console.error('Erro Supabase save:', r.status, errText);
  }
}
</script>
</body>
</html>
