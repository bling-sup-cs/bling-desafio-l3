<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliação — L3 Operações e Qualidade</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#002726;--green:#93F574;--t1:#40615E;--t2:#678A88;--mist:#B9C9C9;--white:#FFFFFF;--card:#03302F;--border:rgba(147,245,116,0.15);--border2:rgba(147,245,116,0.3);--warn:#F6C343}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);-webkit-font-smoothing:antialiased}
.hdr{height:56px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--dark);z-index:100}
.logo{height:22px;width:auto}
.badge{font-size:11px;font-weight:500;color:var(--green);border:1px solid var(--border2);padding:3px 12px;border-radius:99px}
.btn-p{background:var(--green);color:var(--dark);border:none;border-radius:10px;padding:10px 24px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s}
.btn-p:hover{opacity:.88}
.btn-s{background:transparent;color:var(--mist);border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer}
.btn-s:hover{border-color:var(--t2);color:var(--white)}

/* LOGIN */
.login{height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px;text-align:center}
.login-box h2{font-size:22px;font-weight:600;margin-bottom:8px}
.login-box p{font-size:13px;color:var(--mist);margin-bottom:24px}
.inp{width:100%;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--white);font-size:13px;font-family:'Inter',sans-serif;outline:none;margin-bottom:12px}
.inp:focus{border-color:var(--green)}
.err{font-size:12px;color:#E55B5B;margin-top:-8px;margin-bottom:12px;display:none}

/* LAYOUT */
.app{display:none}
.sidebar{width:280px;border-right:1px solid var(--border);height:calc(100vh - 56px);overflow-y:auto;padding:20px;position:sticky;top:56px;flex-shrink:0}
.sidebar h3{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.cand-btn{width:100%;background:transparent;border:1px solid transparent;border-radius:9px;padding:10px 12px;text-align:left;cursor:pointer;font-family:'Inter',sans-serif;margin-bottom:4px;transition:all .15s}
.cand-btn:hover{background:rgba(147,245,116,.05);border-color:var(--border)}
.cand-btn.active{background:rgba(147,245,116,.1);border-color:var(--border2)}
.cand-name{font-size:13px;color:var(--white);font-weight:500}
.cand-email{font-size:11px;color:var(--t2);margin-top:2px}
.cand-score{font-size:11px;color:var(--green);margin-top:2px}
.main-area{flex:1;overflow-y:auto;padding:32px}

/* CONTENT */
.sc-header{margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.sc-header h2{font-size:22px;font-weight:600;margin-bottom:4px}
.sc-header p{font-size:13px;color:var(--mist)}
.scenario-block{margin-bottom:32px}
.scenario-title{font-size:14px;font-weight:600;color:var(--green);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.qa-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.q-text{font-size:13px;font-weight:500;color:var(--white);margin-bottom:12px;line-height:1.6}
.q-num{color:var(--green);font-weight:600;margin-right:6px}
.answer-box{background:rgba(0,0,0,.2);border-radius:8px;padding:14px;font-size:13px;color:var(--mist);line-height:1.75;margin-bottom:16px;min-height:60px;white-space:pre-wrap}
.answer-empty{color:var(--t1);font-style:italic}
.criteria-box{background:rgba(147,245,116,.04);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px}
.criteria-lbl{font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.criteria-txt{font-size:12px;color:var(--mist);line-height:1.7}
.nota-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nota-lbl{font-size:12px;color:var(--mist);flex-shrink:0}
.nota-btns{display:flex;gap:6px}
.nb{width:40px;height:40px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--mist);font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.nb:hover{border-color:var(--green);color:var(--green)}
.nb.selected{background:var(--green);color:var(--dark);border-color:var(--green)}
.save-bar{position:sticky;bottom:0;background:var(--dark);border-top:1px solid var(--border);padding:16px 32px;display:flex;justify-content:space-between;align-items:center}
.save-status{font-size:12px;color:var(--t2)}
.save-status.ok{color:var(--green)}
.empty-state{text-align:center;padding:80px 20px;color:var(--t2)}
.empty-state p{font-size:14px;margin-top:8px}
.score-summary{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:16px 20px;margin-bottom:24px;display:flex;gap:24px;flex-wrap:wrap}
.score-item{text-align:center}
.score-val{font-size:24px;font-weight:600;color:var(--green)}
.score-lbl{font-size:11px;color:var(--t2);margin-top:2px}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login-screen">
  <div class="login-box">
    <h2>Área de Avaliação</h2>
    <p>Acesso restrito à equipe avaliadora.</p>
    <input class="inp" type="password" id="pwd" placeholder="Senha" onkeydown="if(event.key==='Enter')checkPwd()">
    <p class="err" id="pwd-err">Senha incorreta.</p>
    <button class="btn-p" onclick="checkPwd()" style="width:100%">Entrar</button>
  </div>
</div>

       notas:{5:'Analisa os tickets, conversa com o L2, verifica se existe processo/documentação e testa se conseguem resolver com orientação. Distingue a causa antes de agir.',4:'Faz análise dos tickets e conversa com o L2 mas não testa se conseguem resolver com orientação.',3:'Identifica o padrão nos tickets mas assume a causa sem validar com o time.',2:'Vai direto para a solução sem diagnóstico.',1:'Não descreve nenhum processo de diagnóstico.'}},
      {q:'O que você faz para resolver isso de forma definitiva?',
       c:'Solução estrutural: criação ou atualização do processo + treinamento do L2 + acompanhamento por período. Não resolve só o caso pontual. Envolve a liderança do L2 na solução. Sinal de alerta: resolver os 15 casos individualmente sem endereçar a causa raiz.',
       notas:{5:'Propõe solução estrutural: processo + treinamento + acompanhamento. Envolve liderança do L2. Não resolve só o caso pontual.',4:'Propõe treinamento e processo mas sem acompanhamento posterior.',3:'Propõe orientação pontual sem criar processo ou documentação.',2:'Resolve os 15 casos individualmente sem endereçar a causa.',1:'Sem proposta de solução estrutural.'}},
      {q:'Como você mede se a solução funcionou?',
       c:'Define métrica clara: redução de escalonamentos do mesmo tema nos próximos 30/60 dias. Acompanha ativamente e ajusta se necessário. Não aceita "vou ver se melhorou" como métrica.',
       notas:{5:'Define métrica clara (redução de escalonamentos em 30/60 dias), acompanha ativamente e ajusta se necessário.',4:'Define métrica mas sem acompanhamento ativo ou ajuste.',3:'Menciona acompanhamento mas sem métrica definida.',2:'"Vou ver se melhorou" — sem critério objetivo.',1:'Não menciona como vai medir.'}},

       c:'Apresenta o problema com dados (15 casos, 2 meses, mesmo tema), a causa identificada, a solução proposta e o impacto esperado. Tom propositivo, não apenas de reporte de problema.',

  c5:{

    qs:[

       notas:{5:'Levanta todos os tickets, classifica por tempo e impacto, verifica responsáveis e cria visão clara antes de agir.',4:'Faz o levantamento mas sem classificar por impacto ou sem distinguir parado de em andamento.',3:'Levantamento parcial — olha só os mais antigos ou só os sem responsável.',2:'Pergunta para o DEV o status sem fazer levantamento próprio antes.',1:'Não descreve processo de mapeamento.'}},

       c:'Define critérios: impacto no cliente (quantos afetados, impacto operacional), tempo parado (casos com 8 meses merecem atenção especial), plano do cliente (Elite/Diamante têm prioridade). Não trata casos novos como prioritários só por serem novos.',
       notas:{5:'Define critérios claros: impacto, tempo parado e plano do cliente. Não trata casos novos como prioritários só por serem novos.',4:'Define critérios razoáveis mas não considera casos parados há muito tempo como categoria especial.',3:'Prioriza por plano sem considerar tempo parado ou impacto operacional.',2:'Prioriza só os casos novos e deixa os parados para depois.',1:'Sem critério de priorização definido.'}},

       c:'Agenda alinhamento com o DEV apresentando dados (tickets parados, impacto). Tom colaborativo: busca entender impedimentos antes de cobrar. Propõe solução conjunta: responsáveis definidos, prazo de retorno por ticket, processo de atualização periódica. Sinal de alerta: tom acusatório.',
       notas:{5:'Tom colaborativo, apresenta dados, busca entender impedimentos e propõe solução conjunta com responsáveis e prazos definidos.',4:'Abordagem colaborativa mas sem proposta de processo de acompanhamento.',3:'Cobra andamento mas de forma reativa, sem apresentar dados ou propor solução.',2:'Tom acusatório ou que pode gerar atrito com o time de DEV.',1:'Não menciona como vai se comunicar com o DEV.'}},
      {q:'Como você mantém os clientes e o time de suporte informados sobre casos que estão há meses sem resolução?',
       c:'Define processo de atualização periódica para clientes com casos parados (mesmo sem novidade). Orienta time de suporte com script para não criar falsas expectativas. Distingue o que pode comunicar do que não pode.',
       notas:{5:'Define processo de atualização periódica, orienta o time de suporte com script e distingue o que pode comunicar do que não pode.',4:'Define atualização periódica mas sem orientar o time de suporte.',3:'Menciona comunicar mas sem frequência definida ou sem considerar casos muito antigos.',2:'Só comunica quando tem novidade — clientes ficam sem retorno por meses.',1:'Não menciona processo de comunicação.'}}
    ]}
};

let currentSub=null, notes={}, submissions=[], avaliacoes={};

function checkPwd(){
  const v=document.getElementById('pwd').value;
  if(v===PWD){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    loadSubmissions();
  } else {
    document.getElementById('pwd-err').style.display='block';
  }
}

function logout(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
}

async function loadSubmissions(){
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/submissions?select=*&order=created_at.asc`,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Accept':'application/json'}
    });
    if(!r.ok){console.error('submissions error:',r.status,await r.text());return;}
    submissions=await r.json();
    console.log('submissions loaded:',submissions.length);
  }catch(e){console.error('submissions fetch error:',e);}

  try{
    const r2=await fetch(`${SUPABASE_URL}/rest/v1/avaliacoes?select=*`,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Accept':'application/json'}
    });
    if(r2.ok){
      const avs=await r2.json();
      avs.forEach(a=>{avaliacoes[a.submission_id]=a});
      console.log('avaliacoes loaded:',avs.length);
    }
  }catch(e){console.error('avaliacoes fetch error:',e);}

  renderCandList();
}

function renderCandList(){
  const seen={};
  const unique=submissions.filter(s=>{
    if(seen[s.email])return false;
    seen[s.email]=true;return true;
  });
  const list=document.getElementById('cand-list');
  if(!unique.length){list.innerHTML='<p style="font-size:12px;color:var(--t2)">Nenhuma resposta ainda.</p>';return;}
  list.innerHTML=unique.map(s=>{
    const av=avaliacoes[s.id];
    const total=av?Object.values(av).filter(v=>typeof v==='number').reduce((a,b)=>a+b,0):null;
    return `<button class="cand-btn ${currentSub&&currentSub.id===s.id?'active':''}" onclick="selectCandidate(${s.id})">
      <div class="cand-name">${s.name}</div>
      <div class="cand-email">${s.email}</div>
      <div class="cand-score">${total!==null?`✓ Avaliado — ${total} pts`:'Não avaliado'}</div>
    </button>`;
  }).join('');
}

function selectCandidate(id){
  currentSub=submissions.find(s=>s.id===id);
  notes=avaliacoes[id]?{...avaliacoes[id]}:{};
  renderCandList();
  renderMain();
  document.getElementById('save-bar').style.display='flex';
}

function renderMain(){
  if(!currentSub){return;}
  const s=currentSub;
  const totalNotes=Object.keys(CRITERIA).reduce((sum,ck)=>{
    return sum+CRITERIA[ck].qs.reduce((s2,_,qi)=>{
      const k=`${ck}_q${qi+1}`;
      return s2+(notes[k]||0);
    },0);
  },0);
  const maxNotes=Object.keys(CRITERIA).reduce((sum,ck)=>sum+CRITERIA[ck].qs.length*5,0);

  let html=`<div class="sc-header">
    <h2>${s.name}</h2>
    <p>${s.email} · ${s.time_used||'—'} · ${new Date(s.created_at).toLocaleDateString('pt-BR')}</p>
  </div>
  <div class="score-summary">
    ${Object.keys(CRITERIA).map(ck=>{
      const sc=CRITERIA[ck].qs.reduce((sum,_,qi)=>sum+(notes[`${ck}_q${qi+1}`]||0),0);
      const max=CRITERIA[ck].qs.length*5;
      return `<div class="score-item"><div class="score-val">${sc}/${max}</div><div class="score-lbl">${ck.toUpperCase()}</div></div>`;
    }).join('')}
    <div class="score-item"><div class="score-val" style="color:var(--warn)">${totalNotes}/${maxNotes}</div><div class="score-lbl">TOTAL</div></div>
  </div>`;

  Object.keys(CRITERIA).forEach(ck=>{
    const sc=CRITERIA[ck];
    html+=`<div class="scenario-block">
      <div class="scenario-title">◆ ${sc.title}</div>`;
    sc.qs.forEach((q,qi)=>{
      const key=`${ck}_q${qi+1}`;
      const ans=s[key]||s[`${ck}_q${qi+1}`]||'';
      const nota=notes[key]||0;
      html+=`<div class="qa-block">
        <p class="q-text"><span class="q-num">${qi+1}.</span>${q.q}</p>
        <div class="answer-box ${!ans?'answer-empty':''}">${ans||'Não respondido'}</div>
        <div class="criteria-box">
          <p class="criteria-lbl">📋 Critério de avaliação</p>
          <p class="criteria-txt">${q.c}</p>
        </div>
        <div class="nota-row">
          <span class="nota-lbl">Nota:</span>
          <div class="nota-btns">
            ${[1,2,3,4,5].map(n=>`<button class="nb ${nota===n?'selected':''}" onclick="setNota('${key}',${n})">${n}</button>`).join('')}
          </div>
        </div>
        ${nota&&q.notas&&q.notas[nota]?`<div style="margin-top:10px;background:rgba(147,245,116,.06);border:1px solid rgba(147,245,116,.2);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--mist);line-height:1.65"><span style="color:var(--green);font-weight:600">Nota ${nota}:</span> ${q.notas[nota]}</div>`:''}
      </div>`;
    });
    html+=`</div>`;
  });

  document.getElementById('main-area').innerHTML=html;
  document.getElementById('main-area').scrollTo(0,0);
}

function setNota(key,val){
  notes[key]=val;
  renderMain();
  document.getElementById('main-area').scrollTop=document.getElementById('main-area').scrollTop;
}

async function saveNotes(){
  if(!currentSub)return;
  const st=document.getElementById('save-status');
  st.textContent='Salvando…';st.className='save-status';

  // Remove id and created_at from notes before saving
  const {id:_id, created_at:_ca, ...cleanNotes}=notes;
  const payload={submission_id:currentSub.id,name:currentSub.name,email:currentSub.email,...cleanNotes};
  const existing=avaliacoes[currentSub.id];

  let r;
  if(existing && existing.id){
    // Use primary key id for PATCH
    r=await fetch(`${SUPABASE_URL}/rest/v1/avaliacoes?id=eq.${existing.id}`,{
      method:'PATCH',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=representation'},
      body:JSON.stringify(payload)
    });
  } else {
    r=await fetch(`${SUPABASE_URL}/rest/v1/avaliacoes`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=representation'},
      body:JSON.stringify(payload)
    });
  }

  if(r.ok){
    const data=await r.json();
    const saved=Array.isArray(data)?data[0]:data;
    avaliacoes[currentSub.id]={...payload,...saved};
    st.textContent='✓ Avaliação salva!';st.className='save-status ok';
    renderCandList();
  } else {
    const err=await r.text();
    console.error('Save error:',err);
    st.textContent='Erro ao salvar. Tente novamente.';st.className='save-status';
  }
}
</script>
