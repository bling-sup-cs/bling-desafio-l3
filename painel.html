<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Comparativo — L3 Operações e Qualidade</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#002726;--green:#93F574;--t1:#40615E;--t2:#678A88;--mist:#B9C9C9;--white:#FFFFFF;--card:#03302F;--border:rgba(147,245,116,0.15);--border2:rgba(147,245,116,0.3);--warn:#F6C343;--red:#E55B5B}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);-webkit-font-smoothing:antialiased}

/* HEADER */
.hdr{height:56px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--dark);z-index:100}
.logo{height:22px}
.badge{font-size:11px;font-weight:500;color:var(--green);border:1px solid var(--border2);padding:3px 12px;border-radius:99px}
.btn-s{background:transparent;color:var(--mist);border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.btn-s:hover{border-color:var(--t2);color:var(--white)}
.btn-p{background:var(--green);color:var(--dark);border:none;border-radius:10px;padding:10px 24px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s}
.btn-p:hover{opacity:.88}

/* LOGIN */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px;text-align:center}
.login-box h2{font-size:22px;font-weight:600;margin-bottom:8px}
.login-box p{font-size:13px;color:var(--mist);margin-bottom:24px}
.inp{width:100%;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--white);font-size:13px;font-family:'Inter',sans-serif;outline:none;margin-bottom:12px}
.inp:focus{border-color:var(--green)}
.err{font-size:12px;color:var(--red);margin-top:-8px;margin-bottom:12px;display:none}

/* APP */
.app{display:none}
.page{padding:32px}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.stat-val{font-size:28px;font-weight:700;color:var(--green)}
.stat-lbl{font-size:11px;color:var(--t2);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}

/* FILTROS */
.filters{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--white);font-size:13px;font-family:'Inter',sans-serif;outline:none}
.filters select:focus,.filters input:focus{border-color:var(--green)}
.filters option{background:var(--card)}
.filters label{font-size:12px;color:var(--t2)}

/* RANKING TABLE */
.section-title{font-size:14px;font-weight:600;color:var(--green);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.ranking-table{width:100%;border-collapse:collapse;margin-bottom:32px}
.ranking-table th{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border)}
.ranking-table td{padding:12px 14px;border-bottom:1px solid rgba(147,245,116,.07);font-size:13px;vertical-align:middle}
.ranking-table tr:hover td{background:rgba(147,245,116,.03)}
.rank-pos{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.rank-1{background:rgba(255,215,0,.15);color:#FFD700;border:1px solid rgba(255,215,0,.3)}
.rank-2{background:rgba(192,192,192,.15);color:#C0C0C0;border:1px solid rgba(192,192,192,.3)}
.rank-3{background:rgba(205,127,50,.15);color:#CD7F32;border:1px solid rgba(205,127,50,.3)}
.rank-n{background:rgba(147,245,116,.08);color:var(--t2);border:1px solid var(--border)}
.name-cell{display:flex;align-items:center;gap:10px}
.name-info span{display:block}
.name-main{font-weight:500;color:var(--white)}
.name-sub{font-size:11px;color:var(--t2)}
.score-pill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600}
.score-high{background:rgba(147,245,116,.15);color:var(--green);border:1px solid var(--border2)}
.score-mid{background:rgba(246,195,67,.1);color:var(--warn);border:1px solid rgba(246,195,67,.3)}
.score-low{background:rgba(229,91,91,.1);color:var(--red);border:1px solid rgba(229,91,91,.3)}
.mini-bar{display:flex;gap:4px;align-items:center}
.mini-seg{height:8px;border-radius:3px;transition:width .3s}

/* HEATMAP */
.heat-wrap{overflow-x:auto;margin-bottom:32px}
.heat-table{border-collapse:collapse;min-width:700px;width:100%}
.heat-table th{font-size:11px;color:var(--t2);padding:8px 10px;text-align:center;font-weight:500;border-bottom:1px solid var(--border)}
.heat-table th.name-th{text-align:left;min-width:160px}
.heat-table td{padding:6px 8px;text-align:center;font-size:12px}
.heat-table td.name-td{text-align:left;font-weight:500;font-size:13px;padding:8px 10px;white-space:nowrap}
.heat-table tr:hover td{background:rgba(147,245,116,.04)}
.heat-cell{display:inline-flex;align-items:center;justify-content:center;width:36px;height:28px;border-radius:6px;font-weight:600;font-size:12px}
.h5{background:rgba(147,245,116,.25);color:var(--green)}
.h4{background:rgba(147,245,116,.15);color:var(--green)}
.h3{background:rgba(246,195,67,.18);color:var(--warn)}
.h2{background:rgba(229,91,91,.18);color:var(--red)}
.h1{background:rgba(229,91,91,.25);color:var(--red)}
.h0{background:rgba(147,245,116,.04);color:var(--t1);font-style:italic}

/* CHART */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px}
@media(max-width:900px){.chart-row{grid-template-columns:1fr}}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.chart-card h4{font-size:13px;font-weight:600;color:var(--mist);margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-name{font-size:12px;color:var(--mist);width:130px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:12px;background:rgba(147,245,116,.06);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:var(--green);transition:width .5s}
.bar-val{font-size:12px;color:var(--green);width:36px;flex-shrink:0;font-weight:600}
.radar-wrap{display:flex;flex-direction:column;gap:10px}
.radar-row{display:flex;align-items:center;gap:8px}
.radar-lbl{font-size:11px;color:var(--t2);width:90px;flex-shrink:0}
.radar-bar{flex:1;height:10px;background:rgba(147,245,116,.06);border-radius:5px;overflow:hidden}
.radar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--green),rgba(147,245,116,.5))}
.radar-pct{font-size:11px;color:var(--t2);width:36px;text-align:right;flex-shrink:0}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px}
.tab{padding:10px 20px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;background:none;border-left:none;border-right:none;border-top:none;font-family:'Inter',sans-serif}
.tab:hover{color:var(--white)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

/* DETAIL */
.detail-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.detail-name{font-size:24px;font-weight:700}
.detail-email{font-size:13px;color:var(--t2);margin-top:2px}
.score-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sb{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--border2);color:var(--green);background:rgba(147,245,116,.08)}
.detail-grid{display:flex;flex-direction:column;gap:16px}
.det-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.det-q{font-size:13px;font-weight:500;color:var(--white);margin-bottom:10px}
.det-q span{color:var(--green);margin-right:6px;font-weight:700}
.det-ans{background:rgba(0,0,0,.2);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--mist);line-height:1.75;white-space:pre-wrap;margin-bottom:12px;min-height:40px}
.det-nota{font-size:12px;color:var(--green);font-weight:600}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--green);cursor:pointer;margin-bottom:20px;background:none;border:none;font-family:'Inter',sans-serif;padding:0}
.empty{text-align:center;padding:60px 20px;color:var(--t2);font-size:14px}
.loading{font-size:13px;color:var(--t2);padding:24px 0}
.badge-avaliado{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(147,245,116,.1);color:var(--green);border:1px solid var(--border2)}
.badge-pendente{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(246,195,67,.08);color:var(--warn);border:1px solid rgba(246,195,67,.25)}
</style>
</head>

    <h2>Painel Comparativo</h2>
    <p>Acesso restrito à equipe avaliadora.</p>

    <p class="err" id="pwd-err">Senha incorreta.</p>
    <button class="btn-p" onclick="checkPwd()" style="width:100%">Entrar</button>

</div>

    <div id="tab-charts" style="display:none">
      <div class="chart-row">
        <div class="chart-card">
          <h4>Top candidatos por pontuação</h4>
          <div id="chart-top"></div>
        </div>
        <div class="chart-card">
          <h4>Média por cenário (candidatos avaliados)</h4>
          <div id="chart-cenario"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- DETAIL -->
  <div class="page" id="page-detail" style="display:none">
    <button class="back-btn" onclick="showOverview()">← Voltar ao painel</button>
    <div id="detail-content"></div>
  </div>
</div>

<script>
const SUPABASE_URL='https://egtjwpprjiyhwqaolitc.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVndGp3cHByaml5aHdxYW9saXRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNTcyNTQsImV4cCI6MjEwNTgzMzI1NH0.HkU9jTSst6_xebbsNMFwcfssFd3snXZIUnba4F75ShU';
const PWD='Zuchi2211@123';

const CRITERIA={
  c1:{title:'C1 – Triagem',maxQ:5,
    qs:['Prioridade entre casos','Primeiros passos','Comunicação time qualidade','Processo até resolução','Ação com ameaça jurídica']},
  c2:{title:'C2 – Incidente',maxQ:4,
    qs:['Primeiros 10 minutos','Texto do aviso','Acompanhamento do incidente','Mensagem de encerramento']},
  c3:{title:'C3 – Priorização',maxQ:3,
    qs:['Ordem das demandas','O que fazer com cada uma','Comunicação com quem espera']},
  c4:{title:'C4 – Processos',maxQ:4,
    qs:['Avaliar a situação','Solução definitiva','Medir resultado','Comunicar liderança']},
  c5:{title:'C5 – Backlog DEV',maxQ:4,
    qs:['Mapear situação','Priorização','Comunicação com DEV','Informar clientes/suporte']}
};
const MAX_TOTAL=Object.values(CRITERIA).reduce((s,c)=>s+c.maxQ*5,0);

let submissions=[], avaliacoes={}, candidates=[];

function checkPwd(){
  if(document.getElementById('pwd').value===PWD){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    loadData();
  } else {
    document.getElementById('pwd-err').style.display='block';
  }
}
function logout(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
}

async function loadData(){
  showPage('page-loading');
  try {
    const [r1,r2]=await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/submissions?select=*&order=created_at.asc`,
        {headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}}),
      fetch(`${SUPABASE_URL}/rest/v1/avaliacoes?select=*`,
        {headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}})
    ]);
    submissions=await r1.json();
    const avs=await r2.json();
    avaliacoes={};
    avs.forEach(a=>{ avaliacoes[Number(a.submission_id)]=a; });
    buildCandidates();
    renderPage();
  } catch(e){
    console.error(e);
    showPage('page-overview');
    document.getElementById('stats-row').innerHTML='<p style="color:var(--red)">Erro ao carregar dados.</p>';
  }
}

function buildCandidates(){
  // Deduplica por email (mantém o mais recente)
  const byEmail={};
  submissions.forEach(s=>{
    if(!byEmail[s.email]||new Date(s.created_at)>new Date(byEmail[s.email].created_at)){
      byEmail[s.email]=s;
    }
  });
  candidates=Object.values(byEmail).map(s=>{
    const av=avaliacoes[Number(s.id)];
    const scores={};
    let total=0;
    Object.keys(CRITERIA).forEach(ck=>{
      let cScore=0;
      CRITERIA[ck].qs.forEach((_,qi)=>{
        const k=`${ck}_q${qi+1}`;
        const v=av && typeof av[k]==='number' ? av[k] : 0;
        cScore+=v;
        scores[k]=v;
      });
      scores[ck]=cScore;
      total+=cScore;
    });
    return {
      id: Number(s.id),
      name: s.name,
      email: s.email,
      time_used: s.time_used||'—',
      created_at: s.created_at,
      evaluated: !!av,
      total,
      scores,
      sub: s,
      av
    };
  });
}

function scoreClass(s,max){
  const pct=max>0?s/max:0;
  if(pct>=0.8)return'score-high';
  if(pct>=0.5)return'score-mid';
  return'score-low';
}
function heatClass(v){
  if(!v||v===0)return'h0';
  return['','h1','h2','h3','h4','h5'][v]||'h0';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderPage(){
  renderStats();
  renderRanking();
  renderHeatmap();
  renderCharts();
  showPage('page-overview');
}

function renderStats(){
  const total=candidates.length;
  const evaluated=candidates.filter(c=>c.evaluated).length;
  const avg=evaluated>0 ? Math.round(candidates.filter(c=>c.evaluated).reduce((s,c)=>s+c.total,0)/evaluated) : 0;
  const best=candidates.filter(c=>c.evaluated).sort((a,b)=>b.total-a.total)[0];
  document.getElementById('stats-row').innerHTML=`
    <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-lbl">Candidatos</div></div>
    <div class="stat-card"><div class="stat-val">${evaluated}</div><div class="stat-lbl">Avaliados</div></div>
    <div class="stat-card"><div class="stat-val">${total-evaluated}</div><div class="stat-lbl">Pendentes</div></div>
    <div class="stat-card"><div class="stat-val">${avg}/${MAX_TOTAL}</div><div class="stat-lbl">Média geral</div></div>
    <div class="stat-card"><div class="stat-val" style="font-size:16px;padding-top:2px">${best?esc(best.name.split(' ')[0]):'—'}</div><div class="stat-lbl">Melhor pontuação${best?' ('+best.total+'pts)':''}</div></div>
  `;
}

function renderRanking(){
  const sortBy=document.getElementById('sort-select').value;
  const filterVal=(document.getElementById('filter-input').value||'').toLowerCase();

  let list=[...candidates];
  if(filterVal) list=list.filter(c=>c.name.toLowerCase().includes(filterVal)||c.email.toLowerCase().includes(filterVal));
  if(sortBy==='total') list.sort((a,b)=>b.total-a.total);
  else if(sortBy==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'pt'));
  else if(sortBy==='date') list.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));

  const tbody=document.getElementById('ranking-body');
  if(!list.length){ tbody.innerHTML='<tr><td colspan="10" class="empty">Nenhum candidato encontrado.</td></tr>'; return; }

  tbody.innerHTML=list.map((c,i)=>{
    const posClass=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-n';
    const cScores=Object.keys(CRITERIA).map(ck=>{
      const max=CRITERIA[ck].maxQ*5;
      const v=c.scores[ck];
      const cls=c.evaluated?scoreClass(v,max):'score-low';
      return `<td><span class="score-pill ${cls}">${c.evaluated?v+'/'+max:'—'}</span></td>`;
    }).join('');
    return `<tr>
      <td><span class="rank-pos ${posClass}">${i+1}</span></td>
      <td><div class="name-cell"><div class="name-info"><span class="name-main">${esc(c.name)}</span><span class="name-sub">${esc(c.email)}</span></div></div></td>
      ${cScores}
      <td><span class="score-pill ${c.evaluated?scoreClass(c.total,MAX_TOTAL):'score-low'}" style="font-size:14px">${c.evaluated?c.total+'/'+MAX_TOTAL:'—'}</span></td>
      <td>${c.evaluated?'<span class="badge-avaliado">✓ Avaliado</span>':'<span class="badge-pendente">Pendente</span>'}</td>
      <td><button class="btn-s" style="padding:6px 12px;font-size:12px" onclick="showDetail(${c.id})">Ver detalhes</button></td>
    </tr>`;
  }).join('');
}

function renderHeatmap(){
  // Colunas: nome + cada pergunta de cada cenário
  const ckList=Object.keys(CRITERIA);
  const cols=[];
  ckList.forEach(ck=>{
    CRITERIA[ck].qs.forEach((q,qi)=>{
      cols.push({ck,qi,key:`${ck}_q${qi+1}`,label:`${ck.toUpperCase().replace('C','C')}.Q${qi+1}`,desc:q});
    });
  });

  let html=`<thead><tr>
    <th class="name-th">Candidato</th>
    ${ckList.map(ck=>`<th colspan="${CRITERIA[ck].maxQ}" style="background:rgba(147,245,116,.05);border-left:1px solid var(--border)">${CRITERIA[ck].title}</th>`).join('')}
    <th>Total</th>
  </tr><tr>
    <th class="name-th"></th>
    ${cols.map(c=>`<th title="${esc(c.desc)}">${c.key.replace('_q','Q').replace('c','C')}</th>`).join('')}
    <th>/${MAX_TOTAL}</th>
  </tr></thead><tbody>`;

  const sorted=[...candidates].filter(c=>c.evaluated).sort((a,b)=>b.total-a.total);
  sorted.forEach(c=>{
    html+=`<tr><td class="name-td">${esc(c.name.split(' ').slice(0,2).join(' '))}</td>`;
    cols.forEach(col=>{
      const v=c.scores[col.key]||0;
      html+=`<td><span class="heat-cell ${heatClass(v)}">${v||'—'}</span></td>`;
    });
    html+=`<td><b style="color:var(--green)">${c.total}</b></td></tr>`;
  });

  if(!sorted.length) html+=`<tr><td colspan="${cols.length+2}" class="empty">Nenhum candidato avaliado ainda.</td></tr>`;
  html+=`</tbody>`;
  document.getElementById('heat-table').innerHTML=html;
}

function renderCharts(){
  const evaluated=candidates.filter(c=>c.evaluated).sort((a,b)=>b.total-a.total);
  const top=evaluated.slice(0,8);

  // Chart: top candidatos
  const maxBar=top.length?top[0].total:MAX_TOTAL;
  document.getElementById('chart-top').innerHTML=top.length?top.map(c=>{
    const pct=Math.round((c.total/MAX_TOTAL)*100);
    return `<div class="bar-row">
      <span class="bar-name" title="${esc(c.name)}">${esc(c.name.split(' ')[0])}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="bar-val">${c.total}</span>
    </div>`;
  }).join(''):'<p style="font-size:13px;color:var(--t2)">Nenhum candidato avaliado.</p>';

  // Chart: média por cenário
  const ckList=Object.keys(CRITERIA);
  const avgs=ckList.map(ck=>{
    if(!evaluated.length) return {ck,avg:0,max:CRITERIA[ck].maxQ*5};
    const avg=evaluated.reduce((s,c)=>s+(c.scores[ck]||0),0)/evaluated.length;
    return {ck,avg:Math.round(avg*10)/10,max:CRITERIA[ck].maxQ*5};
  });
  document.getElementById('chart-cenario').innerHTML=`<div class="radar-wrap">`+avgs.map(a=>{
    const pct=Math.round((a.avg/a.max)*100);
    return `<div class="radar-row">
      <span class="radar-lbl">${CRITERIA[a.ck].title}</span>
      <div class="radar-bar"><div class="radar-fill" style="width:${pct}%"></div></div>
      <span class="radar-pct">${a.avg}/${a.max}</span>
    </div>`;
  }).join('')+'</div>';
}

function showDetail(id){
  const c=candidates.find(c=>c.id===Number(id));
  if(!c) return;
  const ckList=Object.keys(CRITERIA);
  const scoreBadges=ckList.map(ck=>{
    const max=CRITERIA[ck].maxQ*5;
    return `<span class="sb">${CRITERIA[ck].title}: ${c.evaluated?c.scores[ck]+'/'+max:'—'}</span>`;
  }).join('');

  let html=`<div class="detail-header">
    <div>
      <div class="detail-name">${esc(c.name)}</div>
      <div class="detail-email">${esc(c.email)} · ${esc(c.time_used)} · ${new Date(c.created_at).toLocaleDateString('pt-BR')}</div>
      <div class="score-badges">${scoreBadges}
        <span class="sb" style="border-color:var(--warn);color:var(--warn)">Total: ${c.evaluated?c.total+'/'+MAX_TOTAL:'Não avaliado'}</span>
      </div>
    </div>
  </div><div class="detail-grid">`;

  ckList.forEach(ck=>{
    const cr=CRITERIA[ck];
    html+=`<div class="det-card">
      <div style="font-size:13px;font-weight:700;color:var(--green);margin-bottom:14px">◆ ${esc(cr.title)} — ${c.evaluated?c.scores[ck]+'/'+(cr.maxQ*5)+'pts':'não avaliado'}</div>`;
    cr.qs.forEach((q,qi)=>{
      const key=`${ck}_q${qi+1}`;
      const ans=c.sub[key]||c.sub[key.toUpperCase()]||'';
      const nota=c.evaluated&&c.scores[key]?c.scores[key]:null;
      html+=`<div style="margin-bottom:16px">
        <p class="det-q"><span>${qi+1}.</span>${esc(q)}</p>
        <div class="det-ans">${ans?esc(ans):'<span style="color:var(--t1);font-style:italic">Não respondido</span>'}</div>
        ${nota?`<span class="det-nota">✓ Nota: ${nota}/5</span>`:'<span style="font-size:12px;color:var(--t2)">Sem nota</span>'}
      </div>`;
    });
    html+=`</div>`;
  });

  // Parecer final
  const obsGeral=c.av&&c.av['obs_geral']?c.av['obs_geral']:'';
  const iaNivel=c.av&&c.av['ia_nivel']?c.av['ia_nivel']:'';
  const iaObs=c.av&&c.av['obs_ia']?c.av['obs_ia']:'';

  if(obsGeral||iaNivel||iaObs){
    html+=`<div style="background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:24px;margin-top:4px">
      <p style="font-size:14px;font-weight:600;color:var(--green);margin-bottom:18px">📊 Parecer final</p>`;

    if(obsGeral){
      html+=`<p style="font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">💬 Observações gerais</p>
      <p style="font-size:13px;color:var(--mist);line-height:1.75;white-space:pre-wrap;background:rgba(0,0,0,.15);border-radius:8px;padding:12px 14px">${esc(obsGeral)}</p>`;
    }

    if(iaNivel||iaObs){
      const nivelColor=iaNivel==='alta'?'#E55B5B':iaNivel==='media'?'var(--warn)':'var(--green)';
      html+=`<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
        <p style="font-size:14px;font-weight:600;color:var(--warn);margin-bottom:10px">🤖 Análise de Uso de IA</p>
        ${iaNivel?`<p style="margin-bottom:10px;font-size:13px">Suspeita: <strong style="color:${nivelColor}">${iaNivel.toUpperCase()}</strong></p>`:''}
        ${iaObs?`<p style="font-size:13px;color:var(--mist);line-height:1.75;white-space:pre-wrap">${esc(iaObs)}</p>`:''}
      </div>`;
    }
    html+=`</div>`;
  }

  html+=`</div>`;

  document.getElementById('detail-content').innerHTML=html;
  showPage('page-detail');
}

function showOverview(){
  showPage('page-overview');
}

function showPage(id){
  ['page-loading','page-overview','page-detail'].forEach(p=>{
    document.getElementById(p).style.display=p===id?'block':'none';
  });
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-ranking').style.display=tab==='ranking'?'block':'none';
  document.getElementById('tab-heatmap').style.display=tab==='heatmap'?'block':'none';
  document.getElementById('tab-charts').style.display=tab==='charts'?'block':'none';
}
</script>
</body>
</html>
