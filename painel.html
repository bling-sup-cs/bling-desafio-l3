<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Comparativo — L3 Operações e Qualidade</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#002726;--green:#93F574;--t1:#40615E;--t2:#678A88;--mist:#B9C9C9;--white:#FFFFFF;--card:#03302F;--border:rgba(147,245,116,0.15);--border2:rgba(147,245,116,0.3);--warn:#F6C343}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);-webkit-font-smoothing:antialiased}
.hdr{height:56px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--dark);z-index:100}
.logo{height:22px;width:auto}
.badge{font-size:11px;font-weight:500;color:var(--green);border:1px solid var(--border2);padding:3px 12px;border-radius:99px}
.btn-s{background:transparent;color:var(--mist);border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer}
.btn-s:hover{border-color:var(--t2);color:var(--white)}
.btn-p{background:var(--green);color:var(--dark);border:none;border-radius:10px;padding:10px 24px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}

/* LOGIN */
.login{height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px;text-align:center}
.login-box h2{font-size:22px;font-weight:600;margin-bottom:8px}
.login-box p{font-size:13px;color:var(--mist);margin-bottom:24px}
.inp{width:100%;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--white);font-size:13px;font-family:'Inter',sans-serif;outline:none;margin-bottom:12px}
.inp:focus{border-color:var(--green)}
.err{font-size:12px;color:#E55B5B;margin-top:-8px;margin-bottom:12px;display:none}

/* APP */
.app{display:none;padding:32px}
.page-title{font-size:24px;font-weight:600;margin-bottom:6px}
.page-sub{font-size:13px;color:var(--mist);margin-bottom:28px}

/* RANKING */
.ranking{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:32px}
.rank-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s}
.rank-card:hover{border-color:var(--border2)}
.rank-card.gold{border-color:rgba(246,195,67,.5);background:rgba(246,195,67,.05)}
.rank-pos{font-size:11px;color:var(--t2);margin-bottom:4px}
.rank-name{font-size:14px;font-weight:600;margin-bottom:2px}
.rank-email{font-size:11px;color:var(--t2);margin-bottom:10px}
.rank-total{font-size:28px;font-weight:600;color:var(--green)}
.rank-max{font-size:12px;color:var(--t2)}
.rank-bar{height:4px;background:rgba(147,245,116,.15);border-radius:2px;margin-top:10px}
.rank-bar-fill{height:4px;background:var(--green);border-radius:2px;transition:width .4s}
.rank-status{font-size:11px;margin-top:6px}

/* TABLE */
.table-wrap{overflow-x:auto;margin-bottom:32px}
table{width:100%;border-collapse:collapse;min-width:700px}
th{font-size:11px;color:var(--t2);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
tr:hover td{background:rgba(147,245,116,.03)}
.n{font-weight:600;text-align:center}
.n1{color:#E55B5B}
.n2{color:#F6956A}
.n3{color:var(--warn)}
.n4{color:#7DD87D}
.n5{color:var(--green)}
.n0{color:var(--t1)}
.total-cell{font-weight:700;font-size:14px;color:var(--green)}
.section-title{font-size:13px;font-weight:600;color:var(--green);margin-bottom:12px;margin-top:24px}
.empty{text-align:center;padding:60px;color:var(--t2);font-size:14px}
.chip{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;font-weight:500}
.chip-ok{background:rgba(147,245,116,.15);color:var(--green)}
.chip-no{background:rgba(147,245,116,.05);color:var(--t2)}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login-screen">
  <div class="login-box">
    <h2>Painel Comparativo</h2>
    <p>Acesso restrito à equipe avaliadora.</p>
    <input class="inp" type="password" id="pwd" placeholder="Senha" onkeydown="if(event.key==='Enter')checkPwd()">
    <p class="err" id="pwd-err">Senha incorreta.</p>
    <button class="btn-p" onclick="checkPwd()" style="width:100%">Entrar</button>
  </div>
</div>

      <button class="btn-s" onclick="logout()">Sair</button>
    </div>
  </header>
  <div id="content" style="padding:32px">
    <p style="color:var(--t2);font-size:13px">Carregando...</p>
  </div>
</div>

<script>
const SUPABASE_URL='https://egtjwpprjiyhwqaolitc.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVndGp3cHByaml5aHdxYW9saXRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNTcyNTQsImV4cCI6MjEwNTgzMzI1NH0.HkU9jTSst6_xebbsNMFwcfssFd3snXZIUnba4F75ShU';
const PWD='Zuchi2211@123';

const SCENARIOS=[
  {key:'c1',label:'C1 — Ouvidoria',qs:5,max:25},
  {key:'c2',label:'C2 — Incidente',qs:4,max:20},
  {key:'c3',label:'C3 — Pressão',qs:3,max:15},
  {key:'c4',label:'C4 — Processos',qs:4,max:20},
  {key:'c5',label:'C5 — Backlog',qs:4,max:20},
];
const MAX_TOTAL=100;

function checkPwd(){
  if(document.getElementById('pwd').value===PWD){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    loadData();
  } else {
    document.getElementById('pwd-err').style.display='block';
  }
}

function logout(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
}

async function loadData(){
  const [r1,r2]=await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/submissions?select=*&order=created_at.asc`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}}),
    fetch(`${SUPABASE_URL}/rest/v1/avaliacoes?select=*`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}})
  ]);
  const submissions=await r1.json();
  const avaliacoes=await r2.json();

  // Deduplicate by email (keep first)
  const seen={};
  const unique=submissions.filter(s=>{
    if(seen[s.email])return false;
    seen[s.email]=true;return true;
  });

  // Map avaliacoes by submission_id
  const avMap={};
  avaliacoes.forEach(a=>{avMap[a.submission_id]=a});

  render(unique, avMap);
}

function getScenarioScore(av, sc){
  if(!av)return null;
  let total=0,filled=0;
  for(let i=1;i<=sc.qs;i++){
    const v=av[`${sc.key}_q${i}`];
    if(v!=null){total+=v;filled++;}
  }
  return filled>0?total:null;
}

function getTotal(av){
  if(!av)return null;
  let total=0,filled=0;
  SCENARIOS.forEach(sc=>{
    for(let i=1;i<=sc.qs;i++){
      const v=av[`${sc.key}_q${i}`];
      if(v!=null){total+=v;filled++;}
    }
  });
  return filled>0?total:null;
}

function noteClass(n){
  if(n===null||n===0)return 'n0';
  return ['','n1','n2','n3','n4','n5'][n]||'n0';
}

function perfLabel(pct){
  if(pct>=85)return{text:'Acima do esperado',color:'var(--green)'};
  if(pct>=70)return{text:'Com diferenciais',color:'#7DD87D'};
  if(pct>=55)return{text:'Dentro do esperado',color:'var(--warn)'};
  if(pct>=40)return{text:'Abaixo do esperado',color:'#F6956A'};
  return{text:'Não recomendado',color:'#E55B5B'};
}

function render(candidates, avMap){
  if(!candidates.length){
    document.getElementById('content').innerHTML='<div class="empty">Nenhum candidato ainda.</div>';
    return;
  }

  // Sort by total score desc
  const sorted=[...candidates].map(c=>{
    const av=avMap[c.id];
    const total=getTotal(av);
    return{...c,av,total};
  }).sort((a,b)=>(b.total||0)-(a.total||0));

  let html=`<h1 class="page-title">Painel Comparativo</h1>
  <p class="page-sub">${candidates.length} candidato${candidates.length>1?'s':''} · ${sorted.filter(c=>c.av).length} avaliado${sorted.filter(c=>c.av).length!==1?'s':''}</p>`;

  // RANKING CARDS
  html+=`<div class="ranking">`;
  sorted.forEach((c,idx)=>{
    const pct=c.total?Math.round(c.total/MAX_TOTAL*100):0;
    const perf=c.total?perfLabel(pct):{text:'Não avaliado',color:'var(--t2)'};
    html+=`<div class="rank-card ${idx===0&&c.total?'gold':''}">
      <div class="rank-pos">${idx===0&&c.total?'🥇':idx===1&&c.total?'🥈':idx===2&&c.total?'🥉':`#${idx+1}`}</div>
      <div class="rank-name">${c.name}</div>
      <div class="rank-email">${c.email}</div>
      ${c.total!==null?`
        <div><span class="rank-total">${c.total}</span><span class="rank-max">/${MAX_TOTAL}</span></div>
        <div class="rank-bar"><div class="rank-bar-fill" style="width:${pct}%"></div></div>
        <div class="rank-status" style="color:${perf.color}">${perf.text}</div>
      `:`<div style="font-size:12px;color:var(--t2);margin-top:8px">Aguardando avaliação</div>`}
    </div>`;
  });
  html+=`</div>`;

  // DETAILED TABLE
  html+=`<p class="section-title">Notas por cenário e questão</p>
  <div class="table-wrap"><table>
  <thead><tr>
    <th>Candidato</th>`;
  SCENARIOS.forEach(sc=>{
    for(let i=1;i<=sc.qs;i++){
      html+=`<th style="text-align:center">${sc.key.toUpperCase()} Q${i}</th>`;
    }
    html+=`<th style="text-align:center;color:var(--green)">${sc.label.split('—')[0].trim()}</th>`;
  });
  html+=`<th style="text-align:center;color:var(--green)">TOTAL</th></tr></thead><tbody>`;

  sorted.forEach(c=>{
    html+=`<tr><td><div style="font-weight:500">${c.name}</div><div style="font-size:11px;color:var(--t2)">${c.email}</div></td>`;
    SCENARIOS.forEach(sc=>{
      let scTotal=0,scFilled=0;
      for(let i=1;i<=sc.qs;i++){
        const v=c.av?c.av[`${sc.key}_q${i}`]:null;
        html+=`<td class="n ${noteClass(v)}">${v!=null?v:'—'}</td>`;
        if(v!=null){scTotal+=v;scFilled++;}
      }
      const scScore=scFilled>0?scTotal:null;
      html+=`<td class="n" style="color:var(--green);font-size:14px">${scScore!==null?`${scScore}/${sc.max}`:'—'}</td>`;
    });
    const total=c.total;
    html+=`<td class="n total-cell">${total!==null?`${total}/${MAX_TOTAL}`:'—'}</td></tr>`;
  });

  html+=`</tbody></table></div>`;

  // SCENARIO COMPARISON
  html+=`<p class="section-title">Comparativo por cenário</p>
  <div class="table-wrap"><table>
  <thead><tr><th>Candidato</th>`;
  SCENARIOS.forEach(sc=>{html+=`<th style="text-align:center">${sc.label}</th>`;});
  html+=`<th style="text-align:center">Total</th></tr></thead><tbody>`;

  sorted.forEach(c=>{
    html+=`<tr><td><div style="font-weight:500">${c.name}</div></td>`;
    SCENARIOS.forEach(sc=>{
      const score=getScenarioScore(c.av,sc);
      const pct=score!==null?Math.round(score/sc.max*100):null;
      const color=pct===null?'var(--t2)':pct>=80?'var(--green)':pct>=60?'var(--warn)':'#E55B5B';
      html+=`<td style="text-align:center"><span style="color:${color};font-weight:600">${score!==null?`${score}/${sc.max}`:'—'}</span></td>`;
    });
    const total=c.total;
    const pct=total!==null?Math.round(total/MAX_TOTAL*100):null;
    const perf=total!==null?perfLabel(pct):{text:'—',color:'var(--t2)'};
    html+=`<td style="text-align:center"><span style="font-weight:700;color:${perf.color}">${total!==null?`${total}/${MAX_TOTAL}`:'—'}</span></td></tr>`;
  });
  html+=`</tbody></table></div>`;

  document.getElementById('content').innerHTML=html;
}
</script>
</body>
</html>
